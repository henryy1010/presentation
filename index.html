<script>
const DATA=[["Scaffolding Difficult Authentic Reading Texts for Low-Level Learners", "Topic: Supporting Students in Understanding Real-World English Texts\n\nReading authentic English texts can be challenging for students with a low level of English.\n\nThese texts often contain unfamiliar vocabulary, complex grammar, and difficult sentence structures.\n\nHowever, teachers can make authentic texts easier to understand by using scaffolding techniques.\n\nIn this presentation, we will explore how scaffolding helps students develop reading skills, understand challenging texts, and become more confident learners."], ["What Is Scaffolding in Reading?", "Scaffolding is a teaching technique that provides temporary support to students during the learning process.\n\nIt helps learners complete tasks that might be too difficult to do independently.\n\nIn reading lessons, scaffolding may include:\n\n* Explaining important vocabulary before reading.\n* Using pictures and visual materials.\n* Dividing long texts into smaller parts.\n* Asking guiding questions.\n* Providing examples and clear instructions.\n\nThe main goal is to gradually reduce teacher support as students become more independent."], ["What Are Authentic Reading Texts?", "Authentic reading texts are materials originally created for real communication, not specifically for language learners.\n\nThey show students how English is used in everyday life.\n\nExamples of authentic materials include:\n\n* Newspaper articles and online news.\n* Restaurant menus and advertisements.\n* Emails, messages, and social media posts.\n* Travel brochures and websites.\n* Instructions and product descriptions.\n\nAuthentic texts are useful because they connect classroom learning with real-life situations.\n\nHowever, low-level learners may need additional support to understand them successfully."], ["Why Are Authentic Texts Difficult for Low-Level Learners?", "Students at beginner or elementary levels often face several difficulties when reading authentic materials.\n\nThe most common challenges are:\n\n1. Unfamiliar vocabulary: Students may not understand important words.\n2. Complex grammar: Long sentences can make the meaning difficult to follow.\n3. Cultural references: Some information may be unfamiliar to learners.\n4. Too much information: Students may struggle to identify the main ideas.\n5. Lack of confidence: Difficult texts can reduce motivation.\n\nTeachers should identify these challenges and provide appropriate support before asking students to read independently."], ["Pre-Reading Scaffolding Strategies", "Pre-reading activities prepare students for the text and help them understand the topic.\n\nTeachers can use several effective strategies.\n\n1. Activate prior knowledge\n\nAsk students what they already know about the topic.\n\n2. Pre-teach key vocabulary\n\nIntroduce five or six important words using simple definitions and pictures.\n\n3. Use visual support\n\nShow photographs or illustrations related to the text.\n\n4. Make predictions\n\nAsk students to predict the content from the title or images.\n\nThese activities make students more prepared and confident before reading."], ["While-Reading Scaffolding Strategies", "During reading, students need activities that help them understand information step by step.\n\n1. Chunking the text\n\nDivide a long article into short, manageable sections.\n\n2. Gist reading\n\nAsk students to identify the general meaning rather than understand every word.\n\n3. Guiding questions\n\nProvide simple questions to help students find important information.\n\n4. Highlighting key information\n\nEncourage students to underline important words and main ideas.\n\n5. Pair work\n\nAllow students to discuss difficult parts with a partner.\n\nThese strategies help students focus on meaning and reduce confusion."], ["Practical Classroom Example", "Topic: Reading an Authentic Travel Advertisement\n\nLevel: A1–A2\n\nImagine that students need to read a real advertisement about a weekend trip to London.\n\nStep 1. Before Reading\n\nThe teacher shows pictures of London and introduces words such as ticket, hotel, price, and departure.\n\nStep 2. During Reading\n\nStudents read the advertisement in short sections and find important information.\n\nFor example:\n\n* Where is the trip?\n* How much does it cost?\n* When does the trip begin?\n\nStep 3. After Reading\n\nStudents work in pairs and decide whether they would like to take the trip. They explain their choice using simple English.\n\nThis activity combines authentic materials, reading comprehension, and communication."], ["Conclusion: The Importance of Scaffolding", "Scaffolding plays an important role in helping low-level learners understand difficult authentic reading texts.\n\nIt allows teachers to make challenging materials more accessible without removing their real-world meaning.\n\nThe main benefits of scaffolding are:\n\n* Improving reading comprehension.\n* Developing vocabulary knowledge.\n* Increasing motivation and confidence.\n* Encouraging active participation.\n* Supporting independent learning.\n\nTeachers should provide strong support at the beginning and gradually reduce it as students improve.\n\nIn conclusion, effective scaffolding helps learners move from supported reading to independent reading.\n\nThank you for your attention!"]];
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons=['Aa','◉','≡','?','↗'];
const paras=t=>t.split('\n\n');
const p=t=>`<p>${esc(t)}</p>`;
const list=(lines,numbered=false)=>`<div class="list">${lines.map((s,i)=>`<div class="item" style="--i:${i}"><span class="icon">${numbered?i+1:icons[i%5]}</span><span>${esc(s.replace(/^\* /,''))}</span></div>`).join('')}</div>`;
const call=t=>`<div class="callout">${esc(t)}</div>`;
const art=`<div class="art" aria-hidden="true"><div class="orbit"><i class="orb"></i></div><div class="book"><div class="cover"><div class="star">✳</div><div class="booklines"></div><div class="booklines"></div><div class="booklines"></div><div class="booklines"></div></div></div><span class="tile one">Aa → Meaning</span><span class="tile two">Support + Structure</span><span class="tile three">↗ Confidence</span></div>`;
const london=`<svg class="london" viewBox="0 0 500 220" aria-hidden="true"><circle cx="330" cy="95" r="72" fill="none" stroke="#a8c9bc" stroke-width="3"/><circle cx="330" cy="95" r="55" fill="none" stroke="#a8c9bc" stroke-width="1"/><path d="M330 23V167M258 95H402M280 45L380 145M280 145L380 45" stroke="#a8c9bc" stroke-width="2"/><path d="M0 196H500M50 196V130H130V196M75 130V66H108V130M83 66V40L91 15L100 40V66M150 196V120H240V196M160 120V103H172V120M216 120V103H228V120M280 196L330 95L380 196" fill="none" stroke="#132c35" stroke-width="5"/><circle cx="91" cy="91" r="14" fill="#da623c"/><path d="M91 80V91L98 96" fill="none" stroke="#fff" stroke-width="2"/><path d="M145 195Q200 163 255 195" fill="none" stroke="#da623c" stroke-width="6"/></svg>`;
function content(i,a){if(i===0)return `<div><h1>${esc(DATA[i][0])}</h1><div class="intro">${a.map(p).join('')}</div></div>${art}`;
if(i===1)return `<h2>${esc(DATA[i][0])}</h2><div class="columns"><div class="intro">${a.slice(0,3).map(p).join('')}<div class="bridge" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div><div>${list(a[3].split('\n'))}${call(a[4])}</div></div>`;
if(i===2)return `<h2>${esc(DATA[i][0])}</h2><div class="columns"><div class="intro">${a.slice(0,3).map(p).join('')}<div class="media-stack" aria-hidden="true"><div class="paper"><b>DAILY NEWS</b><i></i><i></i><i></i></div><div class="paper"><b>Menu</b><i></i><i></i><i></i></div><div class="paper"><b>✉ Inbox</b><i></i><i></i><i></i></div></div>${p(a[4])}</div><div>${list(a[3].split('\n'))}${call(a[5])}</div></div>`;
if(i===3)return `<h2>${esc(DATA[i][0])}</h2><div class="columns"><div class="intro">${p(a[0])}${p(a[1])}<div class="challenge-art" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="challenge-label">?</span></div>${call(a[3])}</div><div>${list(a[2].split('\n'),true)}</div></div>`;
if(i===4||i===5){let start=i===4?2:1, n=i===4?4:5;return `<h2>${esc(DATA[i][0])}</h2><div class="sectionlead">${a.slice(0,start).map(p).join('')}</div><div class="cards">${Array.from({length:n},(_,j)=>`<div class="card" style="--i:${j}"><span class="num">${j+1}</span><h3>${esc(a[start+j*2])}</h3>${p(a[start+j*2+1])}</div>`).join('')}</div>${call(a[a.length-1])}`;}
if(i===6)return `<h2>${esc(DATA[i][0])}</h2><div class="columns"><div class="intro">${p(a[0])}<span class="level">${esc(a[1])}</span>${p(a[2])}${london}</div><div class="steps"><div class="step" style="--i:0"><h3>${esc(a[3])}</h3>${p(a[4])}</div><div class="step" style="--i:1"><h3>${esc(a[5])}</h3>${p(a[6])}${p(a[7])}<ul>${a[8].split('\n').map(x=>`<li>${esc(x.slice(2))}</li>`).join('')}</ul></div><div class="step" style="--i:2"><h3>${esc(a[9])}</h3>${p(a[10])}</div></div></div>${call(a[11])}`;
return `<h2>${esc(DATA[i][0])}</h2><div class="columns"><div class="intro">${p(a[0])}${p(a[1])}<div class="bridge" aria-hidden="true"><i></i><i></i><i></i><i></i></div>${p(a[4])}</div><div>${p(a[2])}<div style="height:12px"></div>${list(a[3].split('\n'))}${call(a[5])}<div class="thank">${esc(a[6])}</div></div></div>`;}
const classes=['opening','definition','authentic','dark','strategy','strategy while','example','closing'];
$('#deck').innerHTML=DATA.map((d,i)=>`<section class="slide ${classes[i]}" aria-label="Slide ${i+1}: ${esc(d[0])}" aria-hidden="true"><div class="eyebrow"><span>READING / SCAFFOLDING</span><span>${['THE BIG IDEA','TEMPORARY SUPPORT','REAL-WORLD ENGLISH','UNDERSTANDING THE CHALLENGE','BEFORE READING','DURING READING','IN THE CLASSROOM','TOWARD INDEPENDENCE'][i]}</span></div><div class="body">${content(i,paras(d[1]))}</div><div class="footer"><span>SUPPORT → UNDERSTANDING → INDEPENDENCE</span><b>0${i+1} / 08</b></div></section>`).join('');
$('#dots').innerHTML=DATA.map((d,i)=>`<button class="dot" aria-label="Go to slide ${i+1}" data-slide="${i}"></button>`).join('');
$('#overviewGrid').innerHTML=DATA.map((d,i)=>`<button data-slide="${i}"><span>SLIDE 0${i+1}</span>${esc(d[0])}</button>`).join('');
let current=-1,animTimer,sound=false,audioCtx;const slides=[...document.querySelectorAll('.slide')];
function readerHTML(i){return `<div class="read-label">SLIDE 0${i+1} · READING VIEW</div><h2>${esc(DATA[i][0])}</h2>`+paras(DATA[i][1]).map(s=>s.startsWith('* ')?`<ul>${s.split('\n').map(l=>`<li>${esc(l.slice(2))}</li>`).join('')}</ul>`:/^\d+\. .*\n/.test(s)?`<div>${s.split('\n').map(p).join('')}</div>`:/^(\d+\.|Step \d\.)/.test(s)?`<h3>${esc(s)}</h3>`:p(s)).join('');}
function chime(){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const t=audioCtx.currentTime;[520,780].forEach((f,j)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(f,t+j*.045);g.gain.setValueAtTime(0,t+j*.045);g.gain.linearRampToValueAtTime(.035,t+j*.045+.012);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(audioCtx.destination);o.start(t+j*.045);o.stop(t+.24)})}catch(e){}}
function go(n){n=Math.min(7,Math.max(0,n));if(n===current)return;clearTimeout(animTimer);slides.forEach(s=>s.classList.remove('out','enter'));if(current>=0){slides[current].classList.remove('active');slides[current].classList.add('out');slides[current].setAttribute('aria-hidden','true')}current=n;slides[n].classList.add('active','enter');slides[n].setAttribute('aria-hidden','false');animTimer=setTimeout(()=>slides.forEach(s=>s.classList.remove('out')),800);$('#count').textContent=`0${n+1} / 08`;$('#progress').style.width=((n+1)/8*100)+'%';$('#prev').disabled=n===0;$('#next').disabled=n===7;document.querySelectorAll('.dot').forEach((e,j)=>{e.classList.toggle('current',j===n);if(j===n)e.setAttribute('aria-current','step');else e.removeAttribute('aria-current')});$('#reader').innerHTML=readerHTML(n);history.replaceState(null,'','#slide-'+(n+1));chime();}
function size(){const focus=document.body.classList.contains('zoomed'),maxW=innerWidth-(innerWidth<700?24:40),availH=focus?innerHeight-95:innerHeight-175;let width=Math.min(1600,maxW);if(innerWidth>=700||focus)width=Math.min(width,Math.max(150,availH)*16/9);$('#stage').style.width=width+'px';$('#stage').style.height=width*9/16+'px';document.documentElement.style.setProperty('--s',width/1600)}
$('#prev').onclick=()=>go(current-1);$('#next').onclick=()=>go(current+1);document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{go(+b.dataset.slide);closeGrid()});
function toggleReader(force){let open=typeof force==='boolean'?force:!$('#reader').classList.contains('open');$('#reader').classList.toggle('open',open);$('#readBtn').setAttribute('aria-pressed',open)}
$('#readBtn').onclick=()=>toggleReader();$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').textContent=sound?'Sound on':'Sound off';$('#soundBtn').setAttribute('aria-pressed',sound);chime()};
function focusMode(){document.body.classList.toggle('zoomed');size()}$('#focusBtn').onclick=focusMode;$('#exitFocus').onclick=focusMode;
function closeGrid(){const wasOpen=$('#overview').classList.contains('open');$('#overview').classList.remove('open');if(wasOpen)$('#gridBtn').focus()}$('#gridBtn').onclick=()=>{$('#overview').classList.add('open');$('#closeGrid').focus()};$('#closeGrid').onclick=closeGrid;
document.addEventListener('keydown',e=>{if($('#overview').classList.contains('open')){if(e.key==='Escape')closeGrid();if(e.key==='Tab'){let f=[...$('#overview').querySelectorAll('button')],a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}return}if(e.key==='Escape'){document.body.classList.remove('zoomed');size()}if(e.target.tagName==='BUTTON')return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0);if(e.key==='End')go(7);if(e.key.toLowerCase()==='r')toggleReader()});
let touchStart;$('#stage').addEventListener('touchstart',e=>{touchStart=[e.changedTouches[0].clientX,e.changedTouches[0].clientY]},{passive:true});$('#stage').addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart[0],dy=e.changedTouches[0].clientY-touchStart[1];if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3)go(current+(dx<0?1:-1));touchStart=null},{passive:true});window.addEventListener('resize',size);go((parseInt(location.hash.split('-').pop())||1)-1);toggleReader(innerWidth<700);size();
</script></body></html>
